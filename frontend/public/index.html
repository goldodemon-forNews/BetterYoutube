<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterYouTube</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <h1 class="logo">Better<span>YouTube</span></h1>
    </div>
    <div class="header-center">
      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search videos..."
          autocomplete="off"
        />
        <button id="search-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
    </div>
    <div class="header-right">
      <button id="settings-btn" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Settings Panel -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-overlay"></div>
    <div class="settings-content">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" aria-label="Close settings">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <label for="ad-shield-toggle">Ad Shield</label>
          <label class="toggle">
            <input type="checkbox" id="ad-shield-toggle" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label for="interpolation-toggle">AI Frame Interpolation</label>
          <label class="toggle">
            <input type="checkbox" id="interpolation-toggle" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label for="resolution-select">Default Resolution</label>
          <select id="resolution-select">
            <option value="360p">360p</option>
            <option value="480p">480p</option>
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="1440p">1440p</option>
            <option value="2160p">2160p (4K)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main id="main-content">
    <!-- Video Player (hidden by default) -->
    <div id="player-section" class="hidden">
      <div class="player-wrapper">
        <div id="player-container"></div>
      </div>
      <div class="video-info">
        <h2 id="video-title"></h2>
        <div class="video-meta">
          <span id="video-channel"></span>
          <span id="video-views"></span>
          <span id="video-date"></span>
        </div>
        <p id="video-description"></p>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="video-grid" class="video-grid"></div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
    </div>
  </main>

  <script src="/src/utils/helpers.js"></script>
  <script src="/src/utils/api.js"></script>
  <script src="/src/components/player.js"></script>
  <script src="/src/components/search.js"></script>
  <script src="/src/components/settings.js"></script>
  <script src="/src/app.js"></script>
</body>
</html>
